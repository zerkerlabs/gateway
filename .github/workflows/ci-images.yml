# Container images — built on every pull request, published from main and tags.
#
# Separate from ci.yml on purpose: ci.yml is the correctness gate (the same
# `make check` contributors run) and uses no secrets or write permissions. This
# one needs `packages: write` to push, so it keeps its own narrow scope. The PR
# path builds without pushing, which is what stops a Dockerfile from rotting
# quietly between releases.
name: ci-images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Cheap, and it guards a failure neither file shows on its own: the wheel the
  # Rooms suite tests against drifting from the wheel the sidecar image ships.
  check-pins:
    name: check image pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-zmem-pin.sh

  images:
    name: image ${{ matrix.image }}
    needs: check-pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            dockerfile: deploy/Dockerfile.gateway
          - image: rooms
            dockerfile: deploy/Dockerfile.rooms
          - image: zmem-sidecar
            dockerfile: deploy/Dockerfile.zmem
          - image: console
            dockerfile: deploy/Dockerfile.console
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # arm64 without QEMU: the Go images cross-compile in the builder stage
      # (GOARCH=$TARGETARCH), and the ZMem wheel is py3-none-any. Nothing here
      # needs emulation, so the arm64 build costs about what the amd64 one does.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=sha,format=long

      - name: Build${{ github.event_name == 'push' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
