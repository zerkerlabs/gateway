# CI — the merge gate for the public Zerker Gateway repo.
#
# Runs each Go module's own `make check` (tidy-check, fmt-check, vet, lint,
# race-tested tests) as an independent job. This mirrors exactly what
# contributors run locally with `make check`. No secrets are used.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [gateway, rooms, x402types, facilitator, sdk/go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'

      - name: Install pinned dev tools (gofumpt, golangci-lint)
        run: make tools

      - name: make check
        run: make -C ${{ matrix.module }} check

  # Always runs, on every PR: it is cheap (a few greps) and the failure it
  # guards against is one human review has demonstrably missed more than once —
  # stale pre-rename product strings, and the product being called by the
  # company's name. See ADR-0015 in zerkerlabs/gateway-strategy, and
  # scripts/check-naming.sh for the rules and the pinned exceptions.
  check-naming:
    name: check naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Naming guard (ADR-0015)
        run: ./scripts/check-naming.sh

  # The website (www/) is not a Go module, so it gets its own gate rather than a
  # matrix entry. It is path-aware and always-reporting: the job always runs (so
  # the required status context is never missing and can't deadlock a merge) but
  # short-circuits to a no-op when nothing it depends on changed.
  #
  # The path list deliberately includes the two OpenAPI schemas as well as www/
  # itself: the API reference renders from them at build time, so a schema change
  # on a branch that never touches www/ must still rebuild the site and fail
  # loudly if the reference no longer builds against it.
  check-www:
    name: check www
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the site needs rebuilding
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA"...HEAD \
            | grep -qE '^(www/|gateway/openapi\.yaml$|x402types/openapi\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No www/ or OpenAPI changes — skipping the site build."
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: make check
        if: steps.changed.outputs.run == 'true'
        run: make -C www check

  # The gateway's and rooms' persistence suites are behind the `integration`
  # build tag, so `make check` does not run them — they need a real Postgres.
  # Without this job nothing exercises them at all.
  #
  # Deliberately NOT gated on `check`: the suites are independent of the unit
  # gate, and running them in parallel keeps total CI wall-clock down.
  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zerker
          POSTGRES_PASSWORD: zerker
          POSTGRES_DB: zerker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: '**/go.sum'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # zerker-memory ships `zmem serve` as a stdlib ThreadingHTTPServer, so
      # standing up a real backend for the rooms memory client tests needs no
      # container or compose file — just install it, start it on loopback,
      # and poll /readyz. The version is pinned rather than floating so a
      # zerker-memory release can't turn this job red with no local change to
      # explain it; bump this deliberately, in its own commit.
      - name: Install zmem backend
        run: pip install "zerker-memory==0.1.10"

      - name: Generate zmem service token
        run: echo "ZMEM_SERVICE_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start zmem backend
        env:
          ZMEM_TENANT_ID: tnt_rooms_ci
        run: |
          zmem --db "$RUNNER_TEMP/zmem-control.sqlite" serve \
            --tenant-id "$ZMEM_TENANT_ID" --storage-root "$RUNNER_TEMP/zmem-rooms" \
            --host 127.0.0.1 --port 8766 &
          echo $! > "$RUNNER_TEMP/zmem.pid"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8766/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "zmem backend did not become ready within 30s" >&2
          exit 1

      - name: Gateway integration tests (race)
        env:
          TEST_DATABASE_URL: postgres://zerker:zerker@localhost:5432/zerker_test
        # -p 1 runs one package at a time. The integration suites (agent,
        # invocation, credential, policy, settlement) all TRUNCATE shared tables
        # in per-test setup against the ONE TEST_DATABASE_URL, so concurrent
        # packages would wipe each other's rows mid-test. Serialize packages.
        run: make -C gateway integration-test

      # Rooms migrates its own tables (rooms, room_members, room_events) into
      # the same database; nothing in its schema or its schema_migrations
      # version strings collides with the gateway's. Runs after the gateway
      # suite rather than in parallel with it, for the same one-DB reason.
      #
      # ZMEM_TEST_* points the memory client's contract suite at the backend
      # started above; see rooms/internal/memory/zmem_integration_test.go.
      # That suite fails (rather than skips) if these are unset while CI is
      # set, so a broken step here shows up as a red build, not a quiet skip.
      - name: Rooms integration tests (race)
        env:
          TEST_DATABASE_URL: postgres://zerker:zerker@localhost:5432/zerker_test
          ZMEM_TEST_BASE_URL: http://127.0.0.1:8766
          ZMEM_TEST_SERVICE_TOKEN: ${{ env.ZMEM_SERVICE_TOKEN }}
          ZMEM_TEST_TENANT_ID: tnt_rooms_ci
        run: make -C rooms integration-test

      - name: Stop zmem backend
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/zmem.pid")" 2>/dev/null || true
